# Local dev stack — hot-reload app + a throwaway Postgres.
#
#   docker compose -f compose.dev.yaml up         # http://localhost:5180 (vite, HMR)
#   docker compose -f compose.dev.yaml down        # stop, keep the dev DB
#   docker compose -f compose.dev.yaml down -v     # stop and wipe the dev DB
#
# Why this shape:
#  - Source is bind-mounted (./:/app) so edits hot-reload instantly.
#  - node_modules is an ANONYMOUS volume so the container's linux install is not
#    clobbered by (or copied from) the host's — sharp's native binary differs.
#  - Postgres matches prod (postgres-js → real Postgres), so no dialect surprises.
#
# IMPORTANT: `vite dev` does NOT run the adapter-node production entry, so it never
# exercises production startup. Before pushing, ALWAYS run the prod boot
# smoke test:  ./scripts/smoke.sh   (builds and boots `node scripts/start.mjs`, asserts GET / -> 200)
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mira}
      POSTGRES_DB: ${POSTGRES_DB:-mira}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - mira_dev_pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432' # handy for psql from the host
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mira -d mira']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: node:24-trixie-slim
    working_dir: /app
    command: sh -c "npm ci && node scripts/init-db.mjs && npm run dev -- --host 0.0.0.0 --port 5180"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mira}:${POSTGRES_PASSWORD:-mira}@db:5432/${POSTGRES_DB:-mira}
      MEDIA_DIR: /app/data/media
      # Accounts: a fixed dev secret + the password-less Dev login provider, since
      # OAuth needs an HTTPS callback that a plain-HTTP local setup can't provide.
      AUTH_SECRET: dev-only-secret-not-for-prod
      MIRA_DEV_AUTH: '1'
      # Sign in as username "admin" to exercise the administrator UI. A fresh database
      # starts with registration closed, so to try other usernames, first open
      # registration as "admin" (Admin, Settings).
      MIRA_ADMIN_IDENTITIES: 'dev:dev:admin'
    volumes:
      - ./:/app
      - mira_dev_node_modules:/app/node_modules
    ports:
      - '127.0.0.1:5180:5180' # password-less dev login must not be reachable on a LAN
    depends_on:
      db:
        condition: service_healthy

volumes:
  mira_dev_pgdata:
  mira_dev_node_modules:
